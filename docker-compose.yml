name: intlayer-v2

# Shared settings -------------------------------------------------------------
x-bigquery: &bigquery-env
  BQ_ENABLED: "true"
  BQ_PROJECT: ${BQ_PROJECT:-intlayer-local}
  BQ_DATASET: ${BQ_DATASET:-integration}
  BQ_LOCATION: ${BQ_LOCATION:-US}
  # Local emulator. For real BigQuery use docker-compose.gcp.yml (clears this and mounts credentials).
  BQ_EMULATOR_HOST: ${BQ_EMULATOR_HOST:-http://bigquery:9050}

x-il-build: &il-build
  build: { context: ., dockerfile: integration_layer/Dockerfile }
  image: intlayer-v2/integration-layer:latest

services:
  # ---------------------------------------------------------------- data planes
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: integration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d integration"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # BigQuery emulator (github.com/goccy/bigquery-emulator), persisted in a volume.
  bigquery:
    image: ghcr.io/goccy/bigquery-emulator:latest
    command: ["--project=${BQ_PROJECT:-intlayer-local}", "--database=/data/bigquery.db", "--log-level=warn"]
    volumes:
      - bqdata:/data
    ports:
      - "127.0.0.1:9050:9050"
    restart: unless-stopped

  # ---------------------------------------------------------------- one-shot setup
  migrate:
    <<: *il-build
    command: ["python", "-m", "integration_layer.migrate"]
    environment:
      <<: *bigquery-env
      MIGRATE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/integration
      MIGRATE_IL_API_PASSWORD: ${IL_API_DB_PASSWORD:?set in .env}
      MIGRATE_CONSUMER_PASSWORD: ${CONSUMER_DB_PASSWORD:?set in .env}
      MIGRATE_SCHEDULER_PASSWORD: ${SCHEDULER_DB_PASSWORD:?set in .env}
      MIGRATE_BI_READER_PASSWORD: ${BI_READER_DB_PASSWORD:?set in .env}
      MIGRATE_CONSOLE_PASSWORD: ${CONSOLE_DB_PASSWORD:?set in .env}
    depends_on:
      postgres: { condition: service_healthy }
      bigquery: { condition: service_started }
    restart: "no"

  # ---------------------------------------------------------------- integration layer
  il-api:
    <<: *il-build
    environment:
      <<: *bigquery-env
      IL_DATABASE_URL: postgresql://il_api:${IL_API_DB_PASSWORD}@postgres:5432/integration
      IL_API_KEYS: WWMG_Source:${WWMG_API_KEY:?set in .env},MyCareHub:${MYCAREHUB_API_KEY:?set in .env}
      IL_ADMIN_API_KEY: ${ADMIN_API_KEY:?set in .env}
      IL_CALLBACK_SIGNING_SECRET: ${CALLBACK_SIGNING_SECRET}
      IL_CALLBACK_ALLOWED_HOSTS: ${CALLBACK_ALLOWED_HOSTS}
    ports:
      - "8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  il-scheduler:
    <<: *il-build
    command: ["python", "-m", "integration_layer.scheduler"]
    environment:
      <<: *bigquery-env
      SCHEDULER_DATABASE_URL: postgresql://il_scheduler_user:${SCHEDULER_DB_PASSWORD}@postgres:5432/integration
      SCHEDULER_IL_BASE_URL: http://il-api:8000
      SCHEDULER_SOURCE_KEYS: WWMG_Source:${WWMG_API_KEY},MyCareHub:${MYCAREHUB_API_KEY}
      SCHEDULER_CALLBACK_URLS: WWMG_Source:http://wwmg-source:8002/hooks/il,MyCareHub:http://mycarehub:8003/hooks/il
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # ---------------------------------------------------------------- consumer
  consumer-application:
    build: { context: ., dockerfile: consumer_application/Dockerfile }
    image: intlayer-v2/consumer-application:latest
    environment:
      <<: *bigquery-env
      CONSUMER_DATABASE_URL: postgresql://consumer_app:${CONSUMER_DB_PASSWORD}@postgres:5432/integration
      CONSUMER_BACKENDS: postgres,bigquery
      CONSUMER_MAX_CONCURRENCY: "5"
    ports:
      - "8001:8001"     # remove this mapping to run several replicas (--scale consumer-application=3)
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 2m   # lets in-flight requests finish
    restart: unless-stopped

  # ---------------------------------------------------------------- source applications
  wwmg-source:
    build: { context: ., dockerfile: wwmg_source/Dockerfile }
    image: intlayer-v2/wwmg-source:latest
    environment:
      WWMG_IL_BASE_URL: http://il-api:8000
      WWMG_IL_API_KEY: ${WWMG_API_KEY}
      WWMG_CALLBACK_URL: http://wwmg-source:8002/hooks/il
      WWMG_CALLBACK_SIGNING_SECRET: ${CALLBACK_SIGNING_SECRET}
    ports:
      - "8002:8002"
    depends_on:
      il-api: { condition: service_healthy }
    restart: unless-stopped

  mycarehub:
    build: { context: ., dockerfile: mycarehub/Dockerfile }
    image: intlayer-v2/mycarehub:latest
    environment:
      MYCAREHUB_IL_BASE_URL: http://il-api:8000
      MYCAREHUB_IL_API_KEY: ${MYCAREHUB_API_KEY}
      MYCAREHUB_CALLBACK_URL: http://mycarehub:8003/hooks/il
      MYCAREHUB_CALLBACK_SIGNING_SECRET: ${CALLBACK_SIGNING_SECRET}
    ports:
      - "8003:8003"
    depends_on:
      il-api: { condition: service_healthy }
    restart: unless-stopped

  # ---------------------------------------------------------------- operations console
  console:
    build: { context: ., dockerfile: console/Dockerfile }
    image: intlayer-v2/console:latest
    environment:
      <<: *bigquery-env
      CONSOLE_DATABASE_URL: postgresql://console_user:${CONSOLE_DB_PASSWORD}@postgres:5432/integration
      CONSOLE_IL_BASE_URL: http://il-api:8000
      CONSOLE_SOURCE_KEYS: WWMG_Source:${WWMG_API_KEY},MyCareHub:${MYCAREHUB_API_KEY}
      CONSOLE_CALLBACK_URLS: WWMG_Source:http://wwmg-source:8002/hooks/il,MyCareHub:http://mycarehub:8003/hooks/il
      CONSOLE_ADMIN_API_KEY: ${ADMIN_API_KEY}
      CONSOLE_CONSUMER_URL: http://consumer-application:8001
      CONSOLE_WWMG_URL: http://wwmg-source:8002
      CONSOLE_MYCAREHUB_URL: http://mycarehub:8003
    ports:
      - "127.0.0.1:8080:8080"   # localhost only: the console holds the admin key
    depends_on:
      il-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  bqdata:
